# Self-hosted profile cards, committed into this repo so they never break.
#   profile/stats.svg, profile/top-langs.svg  -> GitHub Readme Stats (Action)
#   profile-3d-contrib/*.svg                  -> 3D contribution skyline
#
# The public github-readme-stats.vercel.app instance is paused, so the old
# cards showed as broken images. This generates them inside Actions instead.
#
# Optional: to count private repos/commits, create a classic PAT with
# `repo` + `read:user` scopes, save it as the repository secret STATS_TOKEN,
# and it will be used automatically.

name: Update Profile Cards

on:
  schedule:
    - cron: "30 21 * * *"    # daily, 03:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9&ring_color=58A6FF
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=html,css&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          git commit -m "chore: refresh profile cards" || exit 0
          git push
