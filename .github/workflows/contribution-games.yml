# Arcade versions of the contribution graph: Pac-Man, Breakout and Snake.
# All SVGs are pushed to the `output` branch in ONE step. Two separate
# workflows pushing to the same branch would overwrite each other.
#
# Replaces the old .github/workflows/snake.yml, so delete that file.

name: Generate Contribution Games

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pac-Man + Breakout -> dist/<game>-contribution-graph(-dark).svg
      - name: Generate arcade SVGs
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"

      # Snake -> dist/github-contribution-grid-snake(-dark).svg
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=1F6FEB
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=58A6FF

      - name: Push everything to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
