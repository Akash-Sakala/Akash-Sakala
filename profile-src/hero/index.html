<!doctype html>
<html
  lang="en"
  data-composition-variables='[
  {"id":"name","type":"string","label":"Name","default":"Akash Sakala"},
  {"id":"color-ground","type":"color","label":"Background","default":"#0A0E14"},
  {"id":"color-ink","type":"color","label":"Text","default":"#E6EDF3"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#58A6FF"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=420" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Mona Display"; src: url("assets/fonts/MonaSansDisplay-ExtraBold.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-Medium.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-SemiBold.woff2") format("woff2"); font-weight: 600; }
      :root {
        --color-ground: #0a0e14;
        --color-ink: #e6edf3;
        --color-muted: #8b949e;
        --color-accent: #58a6ff;
        --color-cyan: #56d4dd;
        --color-violet: #a371f7;
        --color-amber: #e3b341;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 420px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Mona Sans", sans-serif; color: var(--color-ink); }
      #bg { position: absolute; inset: 0;
        background:
          radial-gradient(520px 300px at 470px 210px, rgba(31,111,235,0.22), transparent 70%),
          radial-gradient(460px 280px at 1120px 380px, rgba(137,87,229,0.18), transparent 70%),
          radial-gradient(1px 1px at 12px 12px, rgba(139,148,158,0.18) 1px, transparent 1.5px) 0 0 / 24px 24px,
          var(--color-ground); }
      #frame { position: absolute; inset: 14px; border: 1px solid rgba(240,246,252,0.08); border-radius: 18px; }
      svg#net { position: absolute; left: 0; top: 0; width: 1280px; height: 420px; overflow: visible; }
      .lbl { position: absolute; font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: 0.08em; color: var(--color-muted); text-transform: uppercase; }
      #tokens { position: absolute; left: 48px; top: 262px; display: flex; gap: 8px; }
      .tok { font-family: "IBM Plex Mono", monospace; font-size: 15px; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(240,246,252,0.14); color: var(--color-muted); background: rgba(22,27,34,0.7); }
      #text { position: absolute; left: 740px; top: 70px; width: 500px; }
      #name { font-family: "Mona Display", sans-serif; font-weight: 800; font-size: 64px; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
      #name span { display: inline-block; }
      #role { margin-top: 20px; font-size: 25px; line-height: 1.32; font-weight: 500; color: #c9d1d9; }
      #role span { display: inline-block; }
      #role .hl { color: var(--color-accent); font-weight: 600; }
      #chips { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; width: 390px; }
      .chip { font-family: "IBM Plex Mono", monospace; font-size: 15.5px; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(88,166,255,0.35); background: rgba(31,111,235,0.12); color: #cfe3ff; }
      #sub { margin-top: 22px; font-family: "IBM Plex Mono", monospace; font-size: 14.5px; color: var(--color-muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1280" data-height="420">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="0" style="position:absolute;inset:0" data-layout-allow-overlap>
        <div id="bg"></div>
        <div id="frame"></div>
        <div class="lbl" style="left:48px;top:86px">▸ audio</div>
        <div class="lbl" style="left:48px;top:234px">▸ text</div>
        <div id="tokens">
          <div class="tok" id="tk0">train</div>
          <div class="tok" id="tk1">→</div>
          <div class="tok" id="tk2">tune</div>
          <div class="tok" id="tk3">→</div>
          <div class="tok" id="tk4">ship</div>
        </div>
        <svg id="net" viewBox="0 0 1280 420">
          <defs>
            <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
            <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF" /><stop offset="1" stop-color="#A371F7" stop-opacity="0" /></linearGradient>
          </defs>
          <g id="wave"></g>
          <g id="edges"></g>
          <g id="hot"></g>
          <g id="pulses"></g>
          <g id="nodes"></g>
          <path id="beamline" d="M 652 210 C 680 210, 690 150, 724 150" fill="none" stroke="url(#beam)" stroke-width="2.5" />
        </svg>
        <div id="text">
          <div id="name"></div>
          <div id="role">
            <span>ML</span> <span>engineer</span> <span>who</span> <span>trains,</span> <span>fine-tunes</span><br />
            <span>and</span> <span class="hl">ships</span> <span>models</span> <span>end</span> <span>to</span> <span>end.</span>
          </div>
          <div id="chips">
            <div class="chip">LLM post-training</div>
            <div class="chip">Speech AI</div>
            <div class="chip">Vision</div>
            <div class="chip">Full-stack AI apps</div>
          </div>
          <div id="sub">Associate Applications Developer @ Oracle · Bengaluru</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const NS = "http://www.w3.org/2000/svg";
        const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const NAME = vars.name || "Akash Sakala";
        const nameEl = document.getElementById("name");
        NAME.split("").forEach((ch) => { const s = document.createElement("span"); s.innerHTML = ch === " " ? "&nbsp;" : ch; nameEl.appendChild(s); });

        // mulberry32 seeded PRNG
        function rng(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        const rand = rng(42);

        // waveform bars
        const wave = document.getElementById("wave");
        const BARS = 28, bars = [];
        for (let i = 0; i < BARS; i++) {
          const r = document.createElementNS(NS, "rect");
          r.setAttribute("x", 48 + i * 8); r.setAttribute("width", 4); r.setAttribute("rx", 2);
          r.setAttribute("fill", "#56D4DD"); wave.appendChild(r); bars.push(r);
        }

        // network
        const LX = [340, 440, 540, 640], LN = [4, 5, 5, 3], CY = 210, GAP = 54;
        const layers = LX.map((x, li) => Array.from({ length: LN[li] }, (_, k) => ({ x, y: CY + (k - (LN[li] - 1) / 2) * GAP })));
        const edgesG = document.getElementById("edges"), hotG = document.getElementById("hot"), nodesG = document.getElementById("nodes");
        const edges = [];
        layers.forEach((L, li) => { if (li === layers.length - 1) return; L.forEach((a) => layers[li + 1].forEach((b) => {
          const ln = document.createElementNS(NS, "line");
          ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y); ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
          ln.setAttribute("stroke", "rgba(88,166,255,0.13)"); ln.setAttribute("stroke-width", 1.2); edgesG.appendChild(ln);
          const hot = document.createElementNS(NS, "line");
          ["x1","y1","x2","y2"].forEach((k) => hot.setAttribute(k, ln.getAttribute(k)));
          const len = Math.hypot(b.x - a.x, b.y - a.y);
          hot.setAttribute("stroke", "#58A6FF"); hot.setAttribute("stroke-width", 1.4); hot.setAttribute("stroke-opacity", 0.55);
          hot.setAttribute("stroke-dasharray", len); hot.setAttribute("stroke-dashoffset", len); hot.classList.add("hot-" + li);
          hotG.appendChild(hot); edges.push({ a, b, li });
        })); });
        const nodeEls = layers.map((L, li) => L.map((p) => {
          const c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 9);
          c.setAttribute("fill", "#0D1117"); c.setAttribute("stroke", "#58A6FF"); c.setAttribute("stroke-width", 2);
          c.classList.add("n-" + li); nodesG.appendChild(c); return c; }));

        // input feeds: from waveform end / token row into layer 0
        const feeds = [];
        const srcs = [{ x: 276, y: 150 }, { x: 290, y: 278 }];
        layers[0].forEach((p, k) => srcs.forEach((s) => feeds.push({ a: s, b: p })));
        const pulsesG = document.getElementById("pulses");
        const PULSES = 26, pulses = [];
        for (let i = 0; i < PULSES; i++) {
          const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 2.6); c.setAttribute("fill", "#9ECBFF"); c.setAttribute("filter", "url(#glow)");
          pulsesG.appendChild(c);
          const isFeed = i < 8;
          const path = isFeed ? feeds[Math.floor(rand() * feeds.length)] : edges[Math.floor(rand() * edges.length)];
          pulses.push({ el: c, path, phase: rand(), speed: isFeed ? 0.9 + rand() * 0.5 : 0.6 + rand() * 0.6, feed: isFeed });
        }

        const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
        function renderAt(t) {
          const amp = 0.18 + 0.82 * smooth(0.2, 1.0, t) * (1 - smooth(9.0, 9.8, t));
          bars.forEach((r, i) => {
            const v = Math.abs(Math.sin(i * 0.71 + t * 5.2) * Math.sin(i * 0.23 + t * 1.9)) * 0.75 + 0.25 * Math.abs(Math.sin(i * 1.7 + t * 3.1));
            const h = 6 + 62 * amp * v;
            r.setAttribute("y", 150 - h / 2); r.setAttribute("height", h); r.setAttribute("opacity", 0.35 + 0.65 * amp);
          });
          const flow = smooth(0.4, 1.0, t) * (1 - smooth(9.0, 9.6, t));
          const live = smooth(2.2, 3.0, t) * (1 - smooth(9.0, 9.6, t));
          pulses.forEach((p) => {
            const vis = p.feed ? flow : live;
            const u = (p.phase + t * p.speed) % 1;
            const x = p.path.a.x + (p.path.b.x - p.path.a.x) * u, y = p.path.a.y + (p.path.b.y - p.path.a.y) * u;
            p.el.setAttribute("cx", x); p.el.setAttribute("cy", y);
            p.el.setAttribute("opacity", vis * Math.sin(Math.PI * u));
          });
        }

        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: 10, duration: 10, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

        // tokens light in sequence
        gsap.utils.toArray(".tok").forEach((el, i) => {
          tl.fromTo(el, { color: "#8B949E", borderColor: "rgba(240,246,252,0.14)" }, { color: "#F0D58C", borderColor: "rgba(227,179,65,0.6)", duration: 0.25, ease: "power2.out" }, 0.45 + i * 0.14);
          tl.to(el, { color: "#8B949E", borderColor: "rgba(240,246,252,0.14)", duration: 0.3, ease: "power2.in" }, 9.1 + i * 0.03);
        });

        // layer activation sweep
        layers.forEach((L, li) => {
          const t0 = 1.05 + li * 0.38;
          tl.fromTo(".n-" + li, { attr: { fill: "#0D1117", r: 9 }, opacity: 0.45 }, { attr: { fill: "#1F6FEB", r: 10.5 }, opacity: 1, duration: 0.35, ease: "expo.out", stagger: 0.05 }, t0);
          tl.to(".n-" + li, { attr: { fill: "#0D1117", r: 9 }, opacity: 0.45, duration: 0.3, ease: "power2.in" }, 9.15);
          if (li < layers.length - 1) {
            tl.fromTo(".hot-" + li, { strokeDashoffset: (i, el) => el.getAttribute("stroke-dasharray") }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut", stagger: 0.008 }, t0 + 0.12);
            tl.to(".hot-" + li, { strokeOpacity: 0, duration: 0.3, ease: "power2.in" }, 9.15);
          }
        });
        tl.fromTo("#beamline", { strokeDasharray: 120, strokeDashoffset: 120, opacity: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" }, 2.45);
        tl.to("#beamline", { opacity: 0, duration: 0.25, ease: "power2.in" }, 9.15);

        // name per letter, role per word, chips, sub
        tl.fromTo("#name span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", stagger: 0.045 }, 2.65);
        tl.fromTo("#role span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.075 }, 3.35);
        tl.fromTo(".chip", { opacity: 0, scale: 0.94, filter: "blur(4px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(1.4)", stagger: 0.1 }, 4.25);
        tl.fromTo("#sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.75);

        // exit (shorter than entrance), back to the opening frame
        tl.to(["#sub", ".chip", "#role span", "#name span"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.012 }, 9.2);

        renderAt(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
